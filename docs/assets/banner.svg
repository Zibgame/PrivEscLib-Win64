<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PrivEscLib-Win64</title>
  <desc id="desc">Windows privilege elevation library for C++ security research</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b0d"/>
      <stop offset="1" stop-color="#11191b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5dffb1" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#263437" stroke-width="2"/>

  <circle cx="34" cy="31" r="6" fill="#ff5f56"/>
  <circle cx="55" cy="31" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="31" r="6" fill="#27c93f"/>
  <text x="100" y="37" fill="#708086" font-family="Consolas,monospace" font-size="15">security-research / windows-x64</text>

  <text x="72" y="114" fill="#00ff88" font-family="Consolas,monospace" font-size="20" filter="url(#glow)">&gt; initializing windows elevation library...</text>
  <text x="72" y="195" fill="#f3f7f5" font-family="Consolas,monospace" font-size="64" font-weight="700" letter-spacing="-2">PrivEscLib</text>
  <text x="445" y="195" fill="#00ff88" font-family="Consolas,monospace" font-size="64" font-weight="700">-Win64</text>

  <rect x="72" y="222" width="1056" height="2" fill="url(#line)"/>
  <text x="72" y="267" fill="#9bacb0" font-family="Consolas,monospace" font-size="19" letter-spacing="2">REUSABLE WINDOWS ELEVATION LIBRARY  //  C++  //  SECURITY RESEARCH</text>
  <rect x="72" y="287" width="12" height="3" fill="#00ff88" filter="url(#glow)"/>
</svg>
